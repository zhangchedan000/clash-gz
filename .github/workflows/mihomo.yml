name: 生成 mihomo 配置

on:
  push:
    paths:
      - "*.ini"
      - tools/ini2mihomo.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/ini2mihomo.py Custom_Clash_Full.ini
      - name: 提交生成的配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Custom_Clash_Full.mihomo.yaml
          git diff --cached --quiet || git commit -m "自动生成 Custom_Clash_Full.mihomo.yaml"
          git push
      - name: 刷新 jsDelivr 缓存
        run: curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/Custom_Clash_Full.mihomo.yaml" || true
